<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>
<body>
    <div class="container">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        
        <h3>Nama : Gardian Athoya Rahman</h3>
        <h3>NIM : 20240140083</h3>

        <form id="searchForm">
            <input type="text" id="inputKota" placeholder="Masukkan nama kota..." value="jakarta">
            <button type="submit">Cari</button>
        </form>
        <hr>

        kota : <p id="lokasi"></p>
        <hr>
        negara : <p id="negara"></p>
        <hr>
        koordinat : <p id="koordinat"></p>
        <hr>
        matching text : <p id="matching_text"></p>
        <hr>
        place name : <p id="place_name"></p>
    </div>

    <script>
        const apiKey = "FCiXCP3dkD1ytBHZ5zIH";

        function cariKota(namaKota) {
            const urlapi = "https://api.maptiler.com/geocoding/" + encodeURIComponent(namaKota) + ".json?key=" + apiKey;

            $.ajax({
                url: urlapi,
                method: "GET",
                success: function(data) {
                    if (data.features && data.features.length > 0) {
                        const feature = data.features[0];

                        let lokasi = feature.text || "-";
                        let negaraData = feature.context ? feature.context.find(c => c.id.startsWith("country")) : null;
                        let negara = negaraData ? negaraData.text : "-";

                        let lng = feature.geometry.coordinates[0];
                        let lat = feature.geometry.coordinates[1];
                        let koordinat = lat + ", " + lng;

                        let matchingText = feature.matching_text || feature.text || "-";
                        let placeName = feature.place_name || "-";

                        $("#lokasi").text(lokasi);
                        $("#negara").text(negara);
                        $("#koordinat").text(koordinat);
                        $("#matching_text").text(matchingText);
                        $("#place_name").text(placeName);
                    }
                },
                error: function(error) {
                    console.log(error);
                }
            });
        }

        $(document).ready(function() {
            cariKota("jakarta");

            $("#searchForm").on("submit", function(e) {
                e.preventDefault();
                let keyword = $("#inputKota").val().trim();
                if (keyword !== "") {
                    cariKota(keyword);
                }
            });
        });
    </script>
</body>
</html>
