<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <h3>Nama : Gardian Athoya Rahman</h3>
    <h3>NIM : 20240140083</h3>

    kota : <p id="lokasi"></p>
    <hr>
    negara : <p id="negara"></p>

    <script>
        const kota = "jakarta";
        const urlapi = "https://api.maptiler.com/geocoding/"+kota+".json?key=FCiXCP3dkD1ytBHZ5zIH"

        $.ajax({
            url : urlapi,
            method : "GET",
            success: function(data){
                console.log(data);
                const l = document.getElementById("lokasi");
                const n = document.getElementById("negara");
                
                let lokasi = data.features[0].text; 
                let negara = data.features[0].context[1].text;
                
                l.innerHTML = lokasi;
                n.innerHTML = negara;
            },
            error : function(error){
                console.log(error);
            }
        }); 
    </script>
</body>
